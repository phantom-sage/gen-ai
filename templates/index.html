<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant GPT</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2e3149;
      --accent:    #6c63ff;
      --accent-dk: #5249d6;
      --user-bg:   #6c63ff;
      --bot-bg:    #1e2130;
      --text:      #e2e4f0;
      --muted:     #8b8fa8;
      --radius:    14px;
      --font:      "Inter", system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      background: #2a2d45;
      color: var(--muted);
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    #btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #btn-reset:hover { border-color: var(--accent); color: var(--text); }

    /* ── Messages area ────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* custom scrollbar */
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    /* ── Individual message ───────────────────────────────────── */
    .message {
      display: flex;
      gap: 10px;
      max-width: 780px;
      width: 100%;
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }

    .message.user  { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot   { align-self: flex-start; }

    /* avatar circles */
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 700;
    }
    .message.user .avatar { background: var(--accent); }
    .message.bot  .avatar { background: #2a2e47; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.92rem;
      max-width: calc(100% - 44px);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    /* ── Typing indicator ─────────────────────────────────────── */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* ── Empty state ──────────────────────────────────────────── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      pointer-events: none;
      user-select: none;
    }

    #empty-state .icon { font-size: 48px; opacity: 0.4; }
    #empty-state p { font-size: 0.9rem; text-align: center; max-width: 280px; }

    /* ── Input area ───────────────────────────────────────────── */
    footer {
      padding: 14px 16px 18px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 780px;
      margin: 0 auto;
    }

    #input {
      flex: 1;
      background: #12141f;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.93rem;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s;
    }
    #input::placeholder { color: var(--muted); }
    #input:focus { border-color: var(--accent); }

    #btn-send {
      width: 48px;
      height: 48px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #btn-send:hover   { background: var(--accent-dk); }
    #btn-send:active  { transform: scale(0.94); }
    #btn-send:disabled { background: #3a3d55; cursor: not-allowed; }

    #btn-send svg { width: 20px; height: 20px; fill: #fff; }

    /* ── Settings row ─────────────────────────────────────────── */
    .settings-row {
      display: flex;
      gap: 14px;
      align-items: center;
      max-width: 780px;
      margin: 0 auto 10px;
      flex-wrap: wrap;
    }

    .setting {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .setting label { white-space: nowrap; }

    .setting input[type=range] {
      width: 80px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .setting span {
      font-variant-numeric: tabular-nums;
      min-width: 2.5ch;
      color: var(--text);
    }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 500px) {
      header { padding: 10px 14px; }
      .badge { display: none; }
      #messages { padding: 16px 10px; }
      footer { padding: 10px 10px 14px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <span>Assistant GPT</span>
      <span class="badge">local</span>
    </div>
    <button id="btn-reset" title="Start a new conversation">New chat</button>
  </header>

  <!-- Messages -->
  <div id="messages">
    <div id="empty-state">
      <div class="icon">💬</div>
      <p>Send a message to start chatting with your assistant.</p>
    </div>
  </div>

  <!-- Input -->
  <footer>
    <!-- Generation settings -->
    <div class="settings-row">
      <div class="setting">
        <label for="temperature">Temp</label>
        <input type="range" id="temperature" min="0" max="1.5" step="0.05" value="0.8"
               oninput="document.getElementById('temp-val').textContent = (+this.value).toFixed(2)" />
        <span id="temp-val">0.80</span>
      </div>
      <div class="setting">
        <label for="top_p">Top-p</label>
        <input type="range" id="top_p" min="0.5" max="1" step="0.05" value="0.9"
               oninput="document.getElementById('topp-val').textContent = (+this.value).toFixed(2)" />
        <span id="topp-val">0.90</span>
      </div>
      <div class="setting">
        <label for="max_tokens">Max tokens</label>
        <input type="range" id="max_tokens" min="20" max="256" step="10" value="120"
               oninput="document.getElementById('tok-val').textContent = this.value" />
        <span id="tok-val">120</span>
      </div>
    </div>

    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Message the assistant…"
                aria-label="Message input"></textarea>
      <button id="btn-send" aria-label="Send message">
        <!-- Send arrow icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </footer>

  <script>
    // ── State ──────────────────────────────────────────────────
    let history  = [];   // [[user, assistant], ...]
    let thinking = false;

    // ── DOM refs ───────────────────────────────────────────────
    const messagesEl  = document.getElementById("messages");
    const inputEl     = document.getElementById("input");
    const sendBtn     = document.getElementById("btn-send");
    const resetBtn    = document.getElementById("btn-reset");
    const emptyState  = document.getElementById("empty-state");
    const tempEl      = document.getElementById("temperature");
    const topPEl      = document.getElementById("top_p");
    const maxTokEl    = document.getElementById("max_tokens");

    // ── Auto-resize textarea ───────────────────────────────────
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });

    // ── Send on Enter (Shift+Enter = newline) ──────────────────
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);
    resetBtn.addEventListener("click", resetConversation);

    // ── Helpers ────────────────────────────────────────────────
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(role, text) {
      // Hide empty state on first message
      if (emptyState) emptyState.remove();

      const wrap = document.createElement("div");
      wrap.className = `message ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "U" : "🤖";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function addTypingIndicator() {
      if (emptyState) emptyState.remove();

      const wrap = document.createElement("div");
      wrap.className = "message bot typing";
      wrap.id = "typing-indicator";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "🤖";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    // ── Send message ───────────────────────────────────────────
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || thinking) return;

      // Reset textarea
      inputEl.value = "";
      inputEl.style.height = "auto";

      addMessage("user", text);

      thinking = true;
      sendBtn.disabled = true;
      addTypingIndicator();

      const payload = {
        message:        text,
        history:        history,
        temperature:    parseFloat(tempEl.value),
        top_p:          parseFloat(topPEl.value),
        max_new_tokens: parseInt(maxTokEl.value, 10),
      };

      try {
        const res  = await fetch("/chat", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify(payload),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        removeTypingIndicator();
        addMessage("bot", data.reply);
        history = data.history;   // keep client-side history in sync

      } catch (err) {
        removeTypingIndicator();
        addMessage("bot", `⚠️ Error: ${err.message}`);
      } finally {
        thinking = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // ── Reset conversation ─────────────────────────────────────
    async function resetConversation() {
      if (thinking) return;

      history = [];
      messagesEl.innerHTML = `
        <div id="empty-state">
          <div class="icon">💬</div>
          <p>Send a message to start chatting with your assistant.</p>
        </div>`;

      try {
        await fetch("/reset", { method: "POST" });
      } catch (_) { /* non-critical */ }

      inputEl.focus();
    }

    // Focus input on load
    inputEl.focus();
  </script>
</body>
</html>
