name: Build and Push Docker Image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # matches v1.2.3, v10.0.1, etc.

jobs:
  build-and-push:
    name: Build multi-arch image and push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Extract semantic version from git tag ──────────────────────────
      #   GITHUB_REF looks like  refs/tags/v1.2.3
      #   Strip the leading "refs/tags/v" to get  1.2.3
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      # ── 3. Set up QEMU for cross-compilation ──────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # ── 4. Set up Docker Buildx ───────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Log in to Docker Hub ───────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 6. Build and push ─────────────────────────────────────────────────
      #   Tags the image with the semantic version only — never "latest".
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: phantomsage219/gen-ai:${{ steps.version.outputs.version }}
          # Enable layer caching via GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
